# Updates the WinGet manifest for an existing HW Monitor release.
# The package identifier is the WinGet id Ondery.HWMonitor.
#
# This workflow only runs when it is started by hand from the Actions tab.
# It never runs on push or on release, so nothing is submitted to WinGet
# without an explicit request.
#
# wingetcreate needs a classic personal access token with the public_repo
# scope to open the pull request in microsoft/winget-pkgs. Store it as the
# repository secret WINGET_TOKEN. The default GITHUB_TOKEN cannot do this.

name: Update WinGet - HWMonitor Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.2.1.0)'
        required: true
        type: string
      release_tag:
        description: 'Release tag (leave empty for HWMonitor-v<version>)'
        required: false
        type: string
      submit:
        description: 'Submit the pull request to microsoft/winget-pkgs'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  EXTENSION_NAME: HWMonitor
  GITHUB_USER_NAME: ondery
  GITHUB_REPO: hwmonitor
  WINGET_PACKAGE_ID: Ondery.HWMonitor

jobs:
  update-winget:
    runs-on: windows-latest
    steps:
      - name: Resolve release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $version = $env:INPUT_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must have four parts, for example 0.2.1.0. Got '$version'."
          }
          $tag = $env:INPUT_TAG.Trim()
          if (-not $tag) { $tag = "$env:EXTENSION_NAME-v$version" }

          $repo = "$env:GITHUB_USER_NAME/$env:GITHUB_REPO"
          $assets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Release $tag was not found in $repo." }

          foreach ($arch in @('x64', 'arm64')) {
            $name = "$env:EXTENSION_NAME-Setup-$version-$arch.exe"
            if ($assets -notcontains $name) { throw "Release $tag has no asset $name." }
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Update WinGet manifest
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.release.outputs.VERSION }}
          TAG: ${{ steps.release.outputs.TAG }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          $base = "https://github.com/$env:GITHUB_USER_NAME/$env:GITHUB_REPO/releases/download/$env:TAG"
          $x64Url = "$base/$env:EXTENSION_NAME-Setup-$env:VERSION-x64.exe"
          $arm64Url = "$base/$env:EXTENSION_NAME-Setup-$env:VERSION-arm64.exe"

          Write-Host "Updating WinGet manifest for version $env:VERSION"
          Write-Host "x64 URL: $x64Url"
          Write-Host "ARM64 URL: $arm64Url"

          $arguments = @(
            'update', $env:WINGET_PACKAGE_ID,
            '--version', $env:VERSION,
            '--urls', "$x64Url|x64", "$arm64Url|arm64",
            '--out', 'manifests'
          )

          if ($env:SUBMIT -eq 'true') {
            if (-not $env:WINGET_TOKEN) {
              throw 'Set the WINGET_TOKEN repository secret before submitting.'
            }
            $arguments += @('--token', $env:WINGET_TOKEN, '--submit')
          }

          .\wingetcreate.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed with exit code $LASTEXITCODE" }

      - name: Upload manifests
        if: ${{ !inputs.submit }}
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: manifests/**
          if-no-files-found: warn
